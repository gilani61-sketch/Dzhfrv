<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#090b0e;color:#f3f4f6;font-family:Inter,"Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;right:-300px;top:-250px;background:radial-gradient(circle,rgba(244,119,33,.35),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#2a3038 1px,transparent 1px),linear-gradient(90deg,#2a3038 1px,transparent 1px);background-size:90px 90px;opacity:.25}
.wrap{position:absolute;inset:80px;padding-top:120px}
.logo{width:420px;display:block}
.tag{margin-top:0;display:inline-block;border:1px solid #f47721;color:#f47721;padding:10px 22px;border-radius:40px;font-size:26px;letter-spacing:3px;font-weight:600}
h1{margin-top:40px;font-size:150px;line-height:1;font-weight:900;letter-spacing:-4px}
h1 span{color:#f47721}
p.sub{margin-top:36px;font-size:40px;line-height:1.4;color:#b6bec8;max-width:800px}
.duo{position:absolute;left:0;right:0;bottom:130px;display:flex;align-items:center;gap:24px}
.card{flex:1;background:#15191e;border:1px solid #2a3038;border-radius:22px;padding:34px}
.card b{display:block;font-size:34px;margin-bottom:8px}.card i{font-style:normal;color:#929ca9;font-size:26px}
.plus{font-size:80px;color:#f47721;font-weight:900}
.foot{position:absolute;left:0;bottom:0;color:#929ca9;font-size:26px}
.bar{position:absolute;left:0;bottom:-80px;width:100%;height:10px;background:#f47721}
</style></head><body><div class="grid"></div><div class="glow"></div>
<div class="wrap">
<div class="tag">НЕЙРОНКИ</div>
<h1>Claude<br><span>Дуэт</span></h1>
<p class="sub">Ты ставишь задачу — Claude делает. Вместе быстрее.</p>
<div class="duo"><div class="card"><b>Ты</b><i>идеи и решения</i></div><div class="plus">+</div><div class="card"><b>Claude</b><i>код, отчёты, тексты</i></div></div>
<div class="foot">нейронки · без воды</div>
</div><div class="bar"></div></body></html>
